# ========================
# Clash-ALL 优化配置（已修正版）
# ========================

proxy-providers:
  69云:
    type: http
    url: "https://checkhere.top"
    interval: 3600
    path: ./proxies/69yun.yaml
    health-check:
      enable: true
      interval: 600
      url: http://gstatic.com

  Mitce:
    type: http
    url: "https://mitce.net"
    interval: 3600
    path: ./proxies/mitce.yaml
    health-check:
      enable: true
      interval: 600
      url: http://gstatic.com

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 策略组模板（控制下拉菜单显示内容与顺序）
# ========================
default: &default
  type: select
  proxies:
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 美国-故转
    - 漏网之鱼-故转    # 挪到了五大区之后
    - 香港-手动
    - 台湾-手动
    - 日本-手动
    - 新加坡-手动
    - 美国-手动
    - 漏网之鱼-手动    # 挪到了五大区之后
    - 所有-自动
    - 所有-手动
    - 直连
    - 拒绝

# ========================
# 策略组具体定义（控制面板 UI 视觉排序）
# ========================
proxy-groups:
  # --- 1. 业务分流组（显示在面板最上方，且决定了 GLOBAL 模式的简洁） ---
  - {name: AI, <<: *default}
  - {name: Telegram, <<: *default}
  - {name: YouTube, <<: *default}
  - {name: Twitter, <<: *default}
  - {name: Stream Media, <<: *default}
  - {name: Google, <<: *default}  
  - {name: Microsoft, <<: *default}
  - {name: Apple, <<: *default}
  - {name: Nvidia, <<: *default}
  - {name: Adobe, <<: *default}  
  - {name: Games, <<: *default}
  - {name: Crypto, <<: *default}
  - {name: Sex, <<: *default}
  - {name: Test, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 国内, <<: *default}
  - {name: 漏网之鱼, <<: *default}

  # --- 2. 地区节点组（显示在面板中部） ---
  - name: 香港-故转
    type: fallback
    proxies: [香港-自动, 所有-自动]
    interval: 180
  - name: 香港-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
  - name: 香港-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 台湾-故转
    type: fallback
    proxies: [台湾-自动, 所有-自动]
    interval: 180
  - name: 台湾-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
  - name: 台湾-手动
    type: select
    include-all: true
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  - name: 日本-故转
    type: fallback
    proxies: [日本-自动, 所有-自动]
    interval: 180
  - name: 日本-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 日本-手动
    type: select
    include-all: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  - name: 新加坡-故转
    type: fallback
    proxies: [新加坡-自动, 所有-自动]
    interval: 180
  - name: 新加坡-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
  - name: 新加坡-手动
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"

  - name: 美国-故转
    type: fallback
    proxies: [美国-自动, 所有-自动]
    interval: 180
  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"
  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  # --- 3. 漏网之鱼核心逻辑组（显示在面板最下方） ---
  - name: 漏网之鱼-故转
    type: fallback
    interval: 180
    proxies: [漏网之鱼-自动, 漏网之鱼-手动, 所有-自动]

  - name: 漏网之鱼-自动
    type: url-test
    tolerance: 50
    interval: 180
    proxies: [香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 美国-自动, 漏网之鱼-区域自动]

  - name: 漏网之鱼-手动
    type: select
    proxies: [香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 美国-手动, 漏网之鱼-区域手动]

  # 用于捞出冷门地区的正则组
  - name: 漏网之鱼-区域自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).)*$"

  - name: 漏网之鱼-区域手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).)*$"
  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "^(?=.*((?!(直连|拒绝|流量|时间|官网|有效|重置)).)*$).*$"

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^(?=.*((?!(直连|拒绝|流量|时间|官网|有效|重置)).)*$).*$"
# ========================
# 规则引擎（rules）
# ========================
rules:
  - RULE-SET,ChatGPT / Domain,AI
  - RULE-SET,Sex / Domain,Sex
  - RULE-SET,Test / Domain,Test
  - RULE-SET,Claude / Domain,AI
  - RULE-SET,Groq / Domain,AI
  - RULE-SET,Grok / Domain,AI
  - RULE-SET,Meta AI / Domain,AI
  - RULE-SET,Perplexity / Domain,AI

  - RULE-SET,Twitter / Domain,Twitter
  - RULE-SET,Telegram / Domain,Telegram
  - RULE-SET,Telegram / IP,国外,no-resolve
  - RULE-SET,YouTube / Domain,YouTube
  - RULE-SET,Facebook / Domain,国外
  - RULE-SET,WhatsApp / Domain,国外

  - RULE-SET,Google / Domain,Google
  - RULE-SET,Google / IP,Google

  - RULE-SET,Microsoft / Domain,Microsoft
  - RULE-SET,Apple / Domain,Apple
  - RULE-SET,Apple-CN / Domain,Apple  
  - RULE-SET,OKX / Domain,Crypto
  - RULE-SET,Bybit / Domain,Crypto
  - RULE-SET,Binance / Domain,Crypto
  - RULE-SET,TikTok / Domain,Stream Media
  - RULE-SET,Netflix / Domain,Stream Media
  - RULE-SET,Netflix / IP,Stream Media,no-resolve
  - RULE-SET,Disney / Domain,Stream Media
  - RULE-SET,Amazon / Domain,Stream Media
  - RULE-SET,HBO / Domain,Stream Media
  - RULE-SET,Spotify / Domain,Stream Media
  - RULE-SET,Steam / Domain,Games
  - RULE-SET,Epic / Domain,Games
  - RULE-SET,Nvidia / Domain,Nvidia
  - RULE-SET,Adobe / Domain,Adobe 
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外  
  - RULE-SET,Direct / Domain,国内
  - RULE-SET,China / Domain,国内
  - RULE-SET,China / IP,国内,no-resolve
  - RULE-SET,Private / Domain,国内
  - MATCH,漏网之鱼

