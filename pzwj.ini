[custom]
; ==========================================================
; 1. 规则集定义 (补全了直连与核心业务)
; ==========================================================
ruleset=🍎 苹果服务,https://githubusercontent.com
ruleset=Ⓜ️ 微软服务,https://githubusercontent.com
ruleset=📲 电报信息,https://githubusercontent.com
ruleset=📺 YouTube,https://githubusercontent.com
ruleset=📢 谷歌服务,https://githubusercontent.com

; 全球直连 (修复了 Sing-box 报错项)
ruleset=🎯 全球直连,https://githubusercontent.com
ruleset=🎯 全球直连,https://githubusercontent.com
ruleset=🎯 全球直连,https://githubusercontent.com
ruleset=🎯 全球直连,https://githubusercontent.com
ruleset=🎯 全球直连,https://githubusercontent.com
ruleset=🎯 全球直连,https://githubusercontent.com

; 基础兜底
ruleset=🛑 全球拦截,https://githubusercontent.com
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 2. 策略组定义 (对齐截图样式)
; ==========================================================
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]台湾-故转`[]日本-故转`[]新加坡-故转`[]美国-故转`[]REJECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]台湾-故转`[]日本-故转`[]新加坡-故转`[]美国-故转`[]REJECT
custom_proxy_group=📲 电报信息`select`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]台湾-故转`[]日本-故转`[]新加坡-故转`[]美国-故转`[]DIRECT
custom_proxy_group=📺 YouTube`select`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]台湾-故转`[]日本-故转`[]新加坡-故转`[]美国-故转`[]DIRECT
custom_proxy_group=📢 谷歌服务`select`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]台湾-故转`[]日本-故转`[]新加坡-故转`[]美国-故转`[]DIRECT

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]所有-自动
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]所有-自动`[]所有-手动`[]香港-自动`[]香港-故转`[]美国-故转`[]DIRECT

; ==========================================================
; 3. 逻辑分拣层 (自动、手动、故转定义)
; ==========================================================
custom_proxy_group=所有-自动`url-test`^(?!.*(流量|时间|官网|有效|重置)).*`http://gstatic.com`300,,50
custom_proxy_group=所有-手动`select`^(?!.*(流量|时间|官网|有效|重置)).*
custom_proxy_group=香港-自动`url-test`(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*`http://gstatic.com`300,,50
custom_proxy_group=香港-故转`fallback`[]香港-手动`[]香港-自动`http://gstatic.com`300
custom_proxy_group=香港-手动`select`(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*
custom_proxy_group=台湾-故转`fallback`[]台湾-手动`[]台湾-自动`http://gstatic.com`300
custom_proxy_group=台湾-手动`select`(?=.*(广台|台湾|TW|TaiWan)).*
custom_proxy_group=台湾-自动`url-test`(?=.*(广台|台湾|TW|TaiWan)).*`http://gstatic.com`300,,50
custom_proxy_group=日本-故转`fallback`[]日本-手动`[]日本-自动`http://gstatic.com`300
custom_proxy_group=日本-手动`select`(?=.*(日本|JP|东京|大阪|Japan)).*
custom_proxy_group=日本-自动`url-test`(?=.*(日本|JP|东京|大阪|Japan)).*`http://gstatic.com`300,,50
custom_proxy_group=新加坡-故转`fallback`[]新加坡-手动`[]新加坡-自动`http://gstatic.com`300
custom_proxy_group=新加坡-手动`select`(?=.*(新加坡|SG|坡|狮城|Singapore)).*
custom_proxy_group=新加坡-自动`url-test`(?=.*(新加坡|SG|坡|狮城|Singapore)).*`http://gstatic.com`300,,50
custom_proxy_group=美国-故转`fallback`[]美国-手动`[]美国-自动`http://gstatic.com`300
custom_proxy_group=美国-手动`select`(?=.*(美|US|United States)).*
custom_proxy_group=美国-自动`url-test`(?=.*(美|US|United States)).*`http://gstatic.com`300,,50

; ==========================================================
; 4. 关键修补：Sing-box 必需的 DNS 模块
; ==========================================================
; 修复截图中的 address resolver not found 报错
dns_server=https://dns.google
dns_resolver=223.5.5.5,119.29.29.29
enable_rule_generator=true
overwrite_original_rules=true
