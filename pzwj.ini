[custom]
; ==========================================================
; 规则集分流 (匹配远程列表)
; ==========================================================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=📺 YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 策略组1：业务主控层 (更名后的主界面)
; ==========================================================
# 🚀 节点选择：总闸
custom_proxy_group=🚀 节点选择`select`[]♻️ 全球自动`[]🇭🇰 香港自动`[]🇺🇲 美国自动`[]🇯🇵 日本自动`[]🇸🇬 狮城自动`[]📥 所有手动`[]🎯 全球直连

# 📺 YouTube：专线
custom_proxy_group=📺 YouTube`select`[]🚀 节点选择`[]🇭🇰 香港自动`[]🇺🇲 美国自动`[]🇯🇵 日本自动`[]🇸🇬 狮城自动`[]📥 所有手动`[]🎯 全球直连

# 🌍 国外媒体
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🇭🇰 香港自动`[]🇺🇲 美国自动`[]🇯🇵 日本自动`[]🇸🇬 狮城自动`[]📥 所有手动`[]🎯 全球直连

# 📲 电报信息
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🇭🇰 香港自动`[]🇺🇲 美国自动`[]🇯🇵 日本自动`[]🇸🇬 狮城自动`[]📥 所有手动`[]🎯 全球直连

# 其他服务
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]📥 所有手动
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]🎯 全球直连`[]📥 所有手动
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 全球自动`[]🚀 节点选择`[]🎯 全球直连

# 核心辅助
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🇭🇰 香港自动`[]🇺🇲 美国自动`[]📥 所有手动`[]🎯 全球直连`^(?!.*(流量|时间|官网|有效|重置)).*

; ==========================================================
; 策略组2：逻辑自动层 (Fallback 机制更名)
; ==========================================================
custom_proxy_group=🇭🇰 香港自动`fallback`[]🇭🇰 香港节点`[]♻️ 全球自动`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国自动`fallback`[]🇺🇲 美国节点`[]♻️ 全球自动`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本自动`fallback`[]🇯🇵 日本节点`[]♻️ 全球自动`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城自动`fallback`[]🇸🇬 狮城节点`[]♻️ 全球自动`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 策略组3：物理分拣层 (自动优选)
; ==========================================================
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|东京|大阪|埼玉|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 策略组4：全量收纳层 (清洗伪节点)
; ==========================================================
# ♻️ 全球自动：全量节点延迟测试
custom_proxy_group=♻️ 全球自动`url-test`^(?!.*(流量|时间|官网|有效|重置)).*`http://www.gstatic.com/generate_204`300,,50

# 📥 所有手动：装载所有干净节点供点名
custom_proxy_group=📥 所有手动`select`^(?!.*(流量|时间|官网|有效|重置)).*

enable_rule_generator=true
overwrite_original_rules=true
