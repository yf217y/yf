ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 策略组1：业务主控层 (引用故转组，并清洗节点池)
; ==========================================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇺🇲 美国故转`[]🇭🇰 香港故转`[]🇯🇵 日本故转`[]🇸🇬 狮城故转`[]🚀 手动切换`[]DIRECT`^(?!.*(流量|时间|官网|有效|重置)).*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🎯 全球直连
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🎯 全球直连`
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`^(?!.*(流量|时间|官网|有效|重置)).*

; ==========================================================
; 策略组2：逻辑故转层 (Fallback 机制)
; ==========================================================
custom_proxy_group=🇺🇲 美国故转`fallback`[]🇺🇲 美国节点`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇭🇰 香港故转`fallback`[]🇭🇰 香港节点`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本故转`fallback`[]🇯🇵 日本节点`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城故转`fallback`[]🇸🇬 狮城节点`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 策略组3：物理分拣层 (Url-test 正则组)
; ==========================================================
custom_proxy_group=🇺🇲 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|东京|大阪|埼玉|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 策略组4：全量与保底层 (清洗伪节点)
; ==========================================================
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(流量|时间|官网|有效|重置)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 手动切换`select`^(?!.*(流量|时间|官网|有效|重置)).*

enable_rule_generator=true
overwrite_original_rules=true
